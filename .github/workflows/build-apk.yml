name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Test, lint and build release APK
        run: gradle testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MP3播放器-4.1.0-待签名
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Publish downloadable build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0-build
          name: MP3 播放器 4.1.0 云端构建
          prerelease: true
          body: |
            这是自动构建的未签名 APK，仅供后续使用原车机签名进行正式发布。
            车机请通过应用内更新安装腾讯云分发的正式签名版本。
          files: app/build/outputs/apk/release/app-release-unsigned.apk
