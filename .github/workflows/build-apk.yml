name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Test, lint and build installable debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MP3播放器-4.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish downloadable debug build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0-debug-build
          name: MP3 播放器 4.1.0 可安装测试版
          prerelease: true
          body: |
            这是 GitHub Actions 自动构建的 Debug APK，已使用 Android Debug Key 签名，可直接用于测试安装。
          files: app/build/outputs/apk/debug/app-debug.apk
